# Un solo archivo para todos los entornos (regla de dev/prod parity de
# docs/reference/infraestructura.md): lo que cambia es el `.env`, el nombre
# del proyecto (`-p`) y el profile.
#
#   dev   docker compose -p presencia-dev  up -d                 → solo postgres
#   prod  docker compose -p presencia-prod --profile app up -d   → postgres + app + worker
#
# Los servicios `app` y `worker` viven detrás del profile `app` a propósito:
# el desarrollo diario de Jose corre `pnpm dev` en Windows contra el Postgres
# de este compose por túnel SSH, sin engine de Docker local, y no quiere
# levantar contenedores de aplicación. Sin `--profile app` este archivo se
# comporta exactamente como antes de F8.5.
#
# La receta completa del despliegue está en docs/how-to/desplegar.md y la
# topología en ADR-020.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-presencia}
    ports:
      # Solo loopback: nunca expuesto a internet. El acceso remoto es
      # siempre vía túnel SSH (docs/how-to/levantar-entorno.md, modo B).
      # El host ya tiene el 5434 tomado por el stack de dev: prod usa 5435.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presencia} -d ${POSTGRES_DB:-presencia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    # La imagen la construye CI y se publica en GHCR (ADR-019: el repo es
    # público, así que el paquete también y el VPS hace pull sin credenciales).
    # `build` queda como respaldo para construir a mano en una máquina con
    # engine: `docker compose --profile app build`.
    image: ${APP_IMAGE:-ghcr.io/jata-imk/presencia:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Mismas variables que la API lee en dev (apps/api/src/env.ts). En el .env
    # de prod los hosts son los de la red de compose, no localhost:
    #   APP_DATABASE_URL=postgres://presencia_app:...@postgres:5432/presencia
    env_file:
      - .env
    ports:
      # Loopback igual que Postgres: quien publica al mundo es el nginx de
      # CloudPanel (ADR-020). El 3000 del host ya está ocupado por otra app,
      # así que el mapeo default es 3001 → 3000. NO definir PORT en el .env de
      # prod: el lado del contenedor tiene que seguir siendo 3000.
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    healthcheck:
      # busybox wget: la imagen no trae curl.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    profiles: ["app"]
    image: ${APP_IMAGE:-ghcr.io/jata-imk/presencia:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Misma imagen, distinto entrypoint (ADR-008). No abre puerto, así que no
    # tiene healthcheck: su señal de vida es no estar reiniciando. Es
    # deliberado que un fallo de la cola lo mate — un worker vivo sin jobs
    # registrados se reporta sano y no hace nada.
    command: ["node", "dist/worker.js"]

volumes:
  pgdata:
