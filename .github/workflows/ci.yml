name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: presencia
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: presencia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presencia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Validate docker-compose
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci

      # Aplica las migraciones Drizzle (schema + RLS) contra un Postgres real.
      # Valida el SQL generado, los roles y las policies en cada push.
      - name: Apply migrations
        run: pnpm --filter @presencia/api db:migrate
        env:
          DATABASE_URL: postgres://presencia:ci@localhost:5432/presencia

      # 0001_rls_roles_policies crea presencia_app/presencia_worker sin
      # password (se asigna por entorno, nunca en la migración). Los specs
      # de RLS y créditos conectan como presencia_app contra Postgres real
      # (ver db/rls.spec.ts, credits/credits.service.spec.ts) — sin este
      # paso no podrían autenticar.
      - name: Grant app role password
        run: |
          node -e "
            const { Client } = require('pg');
            (async () => {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              await client.connect();
              await client.query(\"ALTER ROLE presencia_app WITH PASSWORD 'ci'\");
              await client.query(\"ALTER ROLE presencia_worker WITH PASSWORD 'ci'\");
              await client.end();
            })();
          "
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://presencia:ci@localhost:5432/presencia

      # Corre la suite de vitest de apps/api contra el mismo Postgres real —
      # incluye RLS (db/rls.spec.ts) y el test de race condition del DoD de
      # F5 (credits/credits.service.spec.ts). Sin este paso, CI nunca
      # ejecutaba pnpm test.
      - name: Test
        run: pnpm test
        env:
          APP_DATABASE_URL: postgres://presencia_app:ci@localhost:5432/presencia
          BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          BETTER_AUTH_URL: http://localhost:3000
          WEB_URL: http://localhost:5173
          ZEPTOMAIL_TOKEN: ci-token
          MAIL_FROM: ci@example.com
          GOOGLE_GENERATIVE_AI_API_KEY: ci-google-key
