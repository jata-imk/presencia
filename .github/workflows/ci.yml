name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Sin `services:` para Postgres (F10.8): los tests corren contra NUESTRA
    # imagen (Alpine + pgvector, docker/postgres/Dockerfile), que un service
    # container no puede construir. Se construye y se arranca en los pasos de
    # abajo, y así cada PR prueba también que compila y que la extensión carga.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Postgres image
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          platforms: linux/amd64
          load: true
          tags: presencia-postgres:ci
          cache-from: type=gha,scope=presencia-postgres
          cache-to: type=gha,mode=max,scope=presencia-postgres

      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=presencia -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=presencia \
            presencia-postgres:ci
          # Por TCP: durante el initdb el entrypoint levanta un servidor
          # temporal solo por socket, y sin -h ya respondería "listo".
          ready=false
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U presencia; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs postgres; exit 1; fi
          # pgvector instalado y cargable: lo que la imagen promete.
          docker exec postgres psql -U presencia -d presencia -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION vector; SELECT extversion FROM pg_extension WHERE extname = 'vector'; DROP EXTENSION vector;"

      # El tag de la imagen de Postgres sale de los ARG del Dockerfile
      # (release.yml lo calcula igual). Si alguien sube una versión ahí y no
      # en el default de docker-compose.yml, el VPS seguiría con la vieja.
      - name: Postgres image tag in sync
        run: |
          pg=$(sed -n 's/^ARG PG_VERSION=//p' docker/postgres/Dockerfile)
          vec=$(sed -n 's/^ARG PGVECTOR_VERSION=//p' docker/postgres/Dockerfile)
          tag="presencia-postgres:pg${pg}-pgvector${vec}"
          grep -q "$tag" docker-compose.yml || {
            echo "::error::docker-compose.yml no usa $tag (los ARG de docker/postgres/Dockerfile)"
            exit 1
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Validate docker-compose
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci

      # Construye la imagen de la app/worker (ADR-020). No la publica: eso lo
      # hace release.yml, que corre cuando este workflow termina en verde sobre
      # un push a main. Acá solo cierra la puerta a que un Dockerfile roto
      # llegue a main — la máquina de Jose no tiene engine de Docker, así que
      # CI es el único lugar donde esto se ejercita.
      #
      # Con buildx y la caché de GitHub Actions (mismo scope que release.yml):
      # el build de release reutiliza estas capas en vez de repetir el
      # pnpm install y el build de turbo.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=presencia-image
          cache-to: type=gha,mode=max,scope=presencia-image

      # Aplica las migraciones Drizzle (schema + RLS) contra un Postgres real.
      # Valida el SQL generado, los roles y las policies en cada push.
      - name: Apply migrations
        run: pnpm --filter @presencia/api db:migrate
        env:
          DATABASE_URL: postgres://presencia:ci@localhost:5432/presencia

      # 0001_rls_roles_policies crea presencia_app, y
      # 0020_pgboss_owner crea presencia_jobs, todos sin password (se asigna
      # por entorno, nunca en la migración). Los specs de RLS y créditos
      # conectan como presencia_app contra Postgres real (ver db/rls.spec.ts,
      # credits/credits.service.spec.ts), y el de jobs/boss-ownership.spec.ts
      # como presencia_jobs — sin este paso no podrían autenticar.
      - name: Grant app role password
        run: |
          node -e "
            const { Client } = require('pg');
            (async () => {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              await client.connect();
              await client.query(\"ALTER ROLE presencia_app WITH PASSWORD 'ci'\");
              await client.query(\"ALTER ROLE presencia_jobs WITH PASSWORD 'ci'\");
              await client.end();
            })();
          "
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://presencia:ci@localhost:5432/presencia

      # Corre la suite de vitest de apps/api contra el mismo Postgres real —
      # incluye RLS (db/rls.spec.ts) y el test de race condition del DoD de
      # F5 (credits/credits.service.spec.ts). Sin este paso, CI nunca
      # ejecutaba pnpm test.
      - name: Test
        run: pnpm test
        env:
          # Rol owner: boss-ownership.spec.ts lo usa para devolver la cola al
          # estado de una base de dev anterior a 0020 y volver a aplicarla.
          DATABASE_URL: postgres://presencia:ci@localhost:5432/presencia
          APP_DATABASE_URL: postgres://presencia_app:ci@localhost:5432/presencia
          JOBS_DATABASE_URL: postgres://presencia_jobs:ci@localhost:5432/presencia
          BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          BETTER_AUTH_URL: http://localhost:3000
          WEB_URL: http://localhost:5173
          ZEPTOMAIL_TOKEN: ci-token
          MAIL_FROM: ci@example.com
          GOOGLE_GENERATIVE_AI_API_KEY: ci-google-key
