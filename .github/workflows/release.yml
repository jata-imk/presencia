name: Release

# Construye la imagen de app/worker y la publica en GHCR (ADR-020). El VPS no
# construye nada: hace `docker compose pull` de lo que deja este workflow.
#
# Corre DESPUÉS de que CI pase sobre un push a main, no en el push mismo: una
# imagen publicada es lo que el VPS va a bajar, y no tiene que existir nunca
# una imagen hecha de un commit con los tests en rojo.
#
# `workflow_run` tiene una trampa: solo se dispara con la versión de este
# archivo que está en la rama default, así que un cambio acá no se puede
# probar desde un PR — se ve en el primer push a main después de mergearlo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
# Sin workflow_dispatch, a propósito. Un disparo manual no pasa por CI: podía
# publicar como `latest` una punta de main con los tests en rojo. Para
# republicar un commit (p.ej. si el paquete se borró) se usa "Re-run jobs"
# sobre un run anterior de este workflow, que reutiliza su evento original —
# y con él, el CI que ya pasó.

permissions:
  contents: read
  packages: write

# Un grupo POR COMMIT, no uno global. Un grupo global deja un solo run en
# espera y cancela el que ya esperaba aunque cancel-in-progress sea false:
# con tres merges seguidos, uno se perdía sin publicar su `sha-`. Por commit,
# nada se cancela, y un mismo commit republicado a mano espera su turno.
#
# Que los releases de commits distintos corran en paralelo no rompe `latest`:
# ver el último paso.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # workflow_run se dispara también cuando CI falla, y también por los CI de
    # los PRs cuya rama base es main: filtrar las dos cosas acá.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit
        id: commit
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"

      # El commit que CI probó, no el que haya en main al momento de correr:
      # entre los dos puede haber entrado otro merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Solo el tag `sha-<corto>`: la identidad del artefacto. Todo commit con
      # CI verde lo recibe, y fijándolo en APP_IMAGE del .env de prod se vuelve
      # a esa versión sin reconstruir. `latest` NO se publica acá.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
          # Liga el paquete al repo en GHCR. No lo hace público: la primera
          # publicación de un paquete de cuenta personal nace privada y se
          # cambia a mano en Settings del paquete, una sola vez.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          # Misma caché que el build de ci.yml: el CI de main ya construyó
          # estas capas minutos antes, así que acá casi todo es un hit.
          cache-from: type=gha,scope=presencia-image
          cache-to: type=gha,mode=max,scope=presencia-image

      # `latest` = la punta de main, y solo si su CI pasó. Se decide AL FINAL,
      # con la imagen ya publicada, porque decidirlo antes del build dejaba una
      # carrera: el commit A era la punta al empezar, durante su build entraba
      # B y terminaba su release, y A llegaba después a pisar `latest`.
      #
      # Acá la comprobación y el movimiento están a un segundo de distancia
      # (imagetools solo re-etiqueta un manifiesto ya publicado, no construye),
      # y un merge posterior no puede completar su propio release en ese
      # segundo: su CI tarda minutos.
      #
      # Consecuencia buscada: si la punta de main tiene CI en rojo, `latest` se
      # queda donde estaba. Un commit que no es la punta solo tiene su `sha-`.
      #
      # Supuesto: todo push a main corre CI. Se cumple porque a main solo se
      # llega por squash merge de un PR. Un push directo con `[skip ci]` dejaría
      # una punta sin release, y `latest` quieto hasta el siguiente merge.
      - name: Move latest
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          short="${{ steps.commit.outputs.short }}"
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" = "$sha" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" "${IMAGE}:sha-${short}"
          else
            echo "::notice::${short} ya no es la punta de main (${head::7}): publicado solo sha-${short}, latest no se mueve."
          fi
